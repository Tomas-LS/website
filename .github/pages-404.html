<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Mechanical Engineering Portfolio</title>
    <meta name="description" content="This page could not be found. Browse assistive technology projects instead." />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: oklch(0.27 0.065 258);
        --teal: oklch(0.56 0.075 196);
        --ink: oklch(0.23 0.045 258);
        --muted: oklch(0.5 0.025 255);
        --paper: oklch(0.992 0.002 240);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        background: var(--paper);
        color: var(--ink);
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      }
      main { max-width: 30rem; text-align: center; }
      .eyebrow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        margin: 0;
        color: var(--teal);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .rule { width: 2rem; height: 1px; background: currentColor; }
      h1 {
        margin: 1.25rem 0 0;
        font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(2.5rem, 9vw, 3.75rem);
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p { margin: 1rem 0 0; color: var(--muted); line-height: 1.6; font-size: 0.9375rem; }
      .actions { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 0.15s ease, color 0.15s ease;
      }
      .primary { background: var(--navy); color: var(--paper); }
      .primary:hover { background: oklch(0.34 0.065 258); }
      .secondary { border: 1px solid oklch(0.905 0.008 248); color: var(--ink); }
      .secondary:hover { background: oklch(0.95 0.008 240); }
      a:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow"><span class="rule" aria-hidden="true"></span>Error 404<span class="rule" aria-hidden="true"></span></p>
      <h1>Not found</h1>
      <p>This page doesn&apos;t exist or has moved. The projects and contact pages are still reachable from here.</p>
      <div class="actions">
        <a class="primary" href="{{BASE}}">Go home</a>
        <a class="secondary" href="{{BASE}}projects">Browse projects</a>
      </div>
    </main>
  </body>
</html>
