name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run test

      # BASE_PATH is the sub-path the site is served from. A project site lives
      # at /<repo-name>/; a user/org site or a connected custom domain lives at
      # / — set the BASE_PATH repository variable to "/" in that case
      # (Settings → Secrets and variables → Actions → Variables).
      - run: bun run build
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_PROFILE_NAME: ${{ vars.VITE_PROFILE_NAME }}
          VITE_PROFILE_TITLE: ${{ vars.VITE_PROFILE_TITLE }}
          VITE_PROFILE_SPECIALIZATION: ${{ vars.VITE_PROFILE_SPECIALIZATION }}
          VITE_PROFILE_LOCATION: ${{ vars.VITE_PROFILE_LOCATION }}
          VITE_PROFILE_EMAIL: ${{ vars.VITE_PROFILE_EMAIL }}
          VITE_PROFILE_PHONE: ${{ vars.VITE_PROFILE_PHONE }}
          VITE_PROFILE_LINKEDIN_URL: ${{ vars.VITE_PROFILE_LINKEDIN_URL }}
          VITE_PROFILE_LINKEDIN_LABEL: ${{ vars.VITE_PROFILE_LINKEDIN_LABEL }}
          VITE_PROFILE_TAGLINE: ${{ vars.VITE_PROFILE_TAGLINE }}
          VITE_PROFILE_INTRO: ${{ vars.VITE_PROFILE_INTRO }}

      # GitHub Pages serves 404.html for unknown URLs. The template's {{BASE}}
      # marker is replaced with the site's sub-path so its links resolve.
      - name: Write the 404 page
        run: |
          sed "s|{{BASE}}|$BASE_PATH|g" .github/pages-404.html > dist/client/404.html
        env:
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
